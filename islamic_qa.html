<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot" data-theme="light" data-fontfamily="sans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>باب الجواب — استفسارات إسلامية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF6EE; --deep: #0F3D3E; --deep2: #1B5E52;
    --gold: #B8862E; --gold-light: #D9B65C; --ink: #1C2B28; --muted: #7A857F;
    --card: #FFFFFF; --line: #E4DCC8; --chip-bg: #F1ECDD; --chip-active: #0F3D3E;
    --danger: #A6432E; --up: #2F7D5A;
    --content-font: 'Tajawal', sans-serif;
  }
  html[data-theme="dark"]{
    --bg: #12201D; --deep: #0A2724; --deep2: #16413A;
    --gold: #D9B65C; --gold-light: #E8CD84; --ink: #EDE7D6; --muted: #93A199;
    --card: #1B2926; --line: #2C3B36; --chip-bg: #22322E; --chip-active: #1F5347;
  }
  html[data-fontfamily="serif"]{ --content-font: 'Amiri', serif; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg); color: var(--ink); font-family:'Tajawal', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    transition: background 0.25s ease, color 0.25s ease;
  }
  button, select, input, textarea{ font-family:'Tajawal', sans-serif; }

  header{
    width:100%; background: linear-gradient(160deg, var(--deep) 0%, var(--deep2) 100%);
    position:relative; overflow:hidden; padding:24px 20px 16px; text-align:center; color:#F4EFE1;
  }
  .star-pattern{ position:absolute; inset:0; opacity:0.14; pointer-events:none; }
  .star-pattern svg{width:100%;height:100%;}
  header h1{ font-family:'Amiri', serif; font-size:2.1rem; margin:0 0 4px; position:relative; letter-spacing:1px; }
  header p{ margin:0; font-size:0.9rem; color: var(--gold-light); position:relative; }
  header .hijri{ margin-top:6px; font-size:0.78rem; color:#CFE8DC; position:relative; }
  .gold-rule{ width:100px; height:2px; background: var(--gold); margin:10px auto 0; position:relative; }

  .toolbar{
    width:100%; max-width:760px; display:flex; align-items:center; justify-content:space-between;
    gap:6px; padding:10px 14px; flex-wrap:wrap;
  }
  .toolbar-group{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .icon-btn{
    background: var(--card); border:1px solid var(--line); color: var(--ink);
    border-radius:10px; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:1rem; transition: background 0.15s; flex-shrink:0;
  }
  .icon-btn:hover{ background: var(--chip-bg); }
  .icon-btn:focus-visible, button:focus-visible, .chip:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  select.lang-select{
    background: var(--card); border:1px solid var(--line); color: var(--ink);
    border-radius:10px; padding:7px 8px; font-size:0.8rem; cursor:pointer;
  }

  main{ width:100%; max-width:760px; flex:1; display:flex; flex-direction:column; padding:6px 14px 130px; }

  .disclaimer{
    background: var(--chip-bg); border:1px solid var(--line); border-right:4px solid var(--gold);
    border-radius:8px; padding:12px 16px; font-size:0.8rem; color: var(--muted); line-height:1.7; margin-bottom:12px;
  }
  html[dir="ltr"] .disclaimer{ border-right:1px solid var(--line); border-left:4px solid var(--gold); }

  .categories{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chip{
    background: var(--chip-bg); border:1px solid var(--line); color: var(--ink);
    padding:6px 14px; border-radius:999px; font-size:0.8rem; cursor:pointer; transition: all 0.15s;
  }
  .chip.active{ background: var(--chip-active); color:#F4EFE1; border-color:var(--chip-active); }

  .chat{ display:flex; flex-direction:column; gap:16px; }

  .msg{
    max-width:88%; padding:14px 18px; border-radius:14px; line-height:1.85; font-size:0.98rem;
    white-space:pre-wrap; word-break:break-word; position:relative; unicode-bidi:plaintext;
    font-family: var(--content-font);
  }
  .msg.user{ align-self:flex-start; background: var(--deep); color:#F4EFE1; border-bottom-left-radius:4px; }
  .msg.ai{ align-self:flex-end; background: var(--card); border:1px solid var(--line); border-bottom-right-radius:4px; box-shadow: 0 1px 3px rgba(15,61,62,0.06); }
  .msg .label{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:'Amiri', serif; font-size:0.78rem; color: var(--gold); margin-bottom:6px; }
  .msg.user .label{color:var(--gold-light);}
  .cat-tag{ font-family:'Tajawal', sans-serif; font-size:0.65rem; background: rgba(255,255,255,0.15); padding:2px 8px; border-radius:999px; }
  .msg.ai .cat-tag{ background: var(--chip-bg); color:var(--muted); }
  .msg .time{ font-family:'Tajawal', sans-serif; font-size:0.65rem; opacity:0.65; margin-inline-start:auto; }
  .msg .read-time{ font-family:'Tajawal', sans-serif; font-size:0.65rem; color:var(--muted); }

  .msg.streaming .body-text::after{
    content:''; display:inline-block; width:7px; height:7px; margin-inline-start:4px;
    border-radius:50%; background: var(--gold); vertical-align:middle; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  .msg-actions{ display:flex; gap:5px; margin-top:10px; align-items:center; flex-wrap:wrap; }
  .msg-actions button{
    background:transparent; border:1px solid var(--line); color: var(--muted); border-radius:8px;
    padding:4px 9px; font-size:0.72rem; cursor:pointer; font-family:'Tajawal', sans-serif;
    display:flex; align-items:center; gap:4px;
  }
  .msg-actions button:hover{ background: var(--chip-bg); }
  .msg-actions button.on{ color: var(--up); border-color:var(--up); background: rgba(47,125,90,0.08); }
  .msg-actions button.on.down{ color: var(--danger); border-color:var(--danger); background: rgba(166,67,46,0.08); }
  .msg-actions button.bookmarked{ color: var(--gold); border-color:var(--gold); }

  .empty-state{ text-align:center; color: var(--muted); margin-top:24px; font-size:0.95rem; line-height:2; }
  .empty-state .star-mini{ width:50px;height:50px;margin:0 auto 14px;opacity:0.5; }
  .suggestions{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px; }
  .suggestion-chip{
    background: var(--card); border:1px solid var(--line); color: var(--ink);
    padding:8px 14px; border-radius:12px; font-size:0.8rem; cursor:pointer; max-width:280px;
  }
  .suggestion-chip:hover{ background: var(--chip-bg); }

  .thinking{ align-self:flex-end; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:0.86rem; padding:6px 4px; }
  .thinking .spin{ width:20px;height:20px; animation: rotate 3.2s linear infinite; }
  @keyframes rotate{ to { transform: rotate(360deg); } }

  .input-bar{ position:fixed; bottom:0; right:0;left:0; display:flex; flex-direction:column; align-items:center; background: linear-gradient(0deg, var(--bg) 65%, transparent); padding:8px 14px 18px; }
  .char-counter{ width:100%; max-width:760px; text-align:end; font-size:0.68rem; color:var(--muted); padding:0 4px; min-height:16px; }
  .input-inner{
    width:100%; max-width:760px; display:flex; gap:6px; align-items:flex-end;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px;
    box-shadow:0 4px 18px rgba(15,61,62,0.10);
  }
  textarea{ flex:1; border:none; outline:none; resize:none; font-family: var(--content-font); font-size:0.98rem; padding:10px 8px; background:transparent; color:var(--ink); max-height:120px; }
  button.icon-round{
    background: var(--chip-bg); color:var(--ink); border:1px solid var(--line); border-radius:12px;
    width:40px; height:40px; flex-shrink:0; cursor:pointer; font-size:1rem;
  }
  button.icon-round.listening{ background: var(--danger); color:#fff; border-color:var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.6;} }
  button.send{ background: var(--deep); color:#F4EFE1; border:none; border-radius:12px; padding:0 18px; height:40px; font-weight:700; font-size:0.9rem; cursor:pointer; flex-shrink:0; }
  button.send:hover{ background: var(--deep2); }
  button.send:disabled{ background:#8C8C7E; cursor:not-allowed; }

  .overlay{ position:fixed; inset:0; background:rgba(10,20,18,0.55); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; }
  .overlay.open{ display:flex; }
  .modal{ background: var(--card); border-radius:16px; padding:22px; width:100%; max-width:420px; border:1px solid var(--line); max-height:85vh; overflow:auto; }
  .modal h2{ font-family:'Amiri', serif; margin:0 0 16px; font-size:1.25rem; color:var(--ink); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.82rem; margin-bottom:6px; color:var(--muted); }
  .field select, .field input[type=text]{
    width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--line);
    background: var(--bg); color:var(--ink); font-size:0.88rem;
  }
  .seg{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button{ flex:1; padding:8px; background:var(--bg); border:none; color:var(--ink); cursor:pointer; font-size:0.82rem; }
  .seg button.active{ background:var(--deep); color:#F4EFE1; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .modal-actions button{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background: var(--chip-bg); color:var(--ink); font-weight:700; cursor:pointer; font-size:0.86rem; }
  .modal-actions button.primary{ background: var(--deep); color:#F4EFE1; border-color:var(--deep); }
  .modal-actions button.danger{ background: var(--danger); color:#fff; border-color:var(--danger); }

  /* Sidebar drawer */
  .drawer-overlay{ position:fixed; inset:0; background:rgba(10,20,18,0.5); display:none; z-index:55; }
  .drawer-overlay.open{ display:block; }
  .drawer{
    position:fixed; top:0; bottom:0; right:0; width:300px; max-width:86vw; background:var(--card);
    border-left:1px solid var(--line); z-index:56; transform:translateX(100%); transition: transform 0.25s ease;
    display:flex; flex-direction:column; padding:16px;
  }
  html[dir="ltr"] .drawer{ right:auto; left:0; border-left:none; border-right:1px solid var(--line); transform:translateX(-100%); }
  .drawer.open{ transform:translateX(0); }
  .drawer-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .drawer-tabs button{ flex:1; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--muted); cursor:pointer; font-size:0.8rem; }
  .drawer-tabs button.active{ background:var(--deep); color:#F4EFE1; border-color:var(--deep); }
  .drawer input.search{ width:100%; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); margin-bottom:10px; font-size:0.85rem; }
  .drawer-list{ flex:1; overflow:auto; display:flex; flex-direction:column; gap:6px; }
  .conv-item{
    display:flex; align-items:center; gap:6px; padding:9px 10px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); cursor:pointer; font-size:0.85rem;
  }
  .conv-item.active{ border-color:var(--gold); background: var(--chip-bg); }
  .conv-item .title{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv-item .mini-btn{ background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:0.85rem; padding:2px 4px; }
  .bm-item{ padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); font-size:0.82rem; cursor:pointer; }
  .bm-item .snippet{ color:var(--muted); font-size:0.78rem; margin-top:4px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .drawer-footer{ display:flex; gap:8px; margin-top:10px; }
  .drawer-footer button{ flex:1; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--chip-bg); color:var(--ink); cursor:pointer; font-size:0.78rem; }

  .scroll-bottom{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--deep); color:#F4EFE1;
    border:none; border-radius:999px; width:38px; height:38px; cursor:pointer; display:none; z-index:40; font-size:1rem;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
  }
  .scroll-bottom.show{ display:block; }

  .toast-wrap{ position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{ background: var(--deep); color:#F4EFE1; padding:10px 18px; border-radius:10px; font-size:0.85rem; box-shadow:0 4px 14px rgba(0,0,0,0.25); animation: toastIn 0.2s ease; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .lib-answer{ white-space:pre-wrap; line-height:1.9; font-size:0.92rem; padding:8px 0 4px; color:var(--ink); }

  .link-item{ display:flex; justify-content:space-between; align-items:center; padding:11px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); text-decoration:none; color:var(--ink); font-size:0.86rem; }
  .link-item:hover{ background:var(--chip-bg); }
  .link-item span.arrow{ color:var(--gold); }
  .link-item.deceased{ opacity:0.7; }

  .related-wrap{ margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; }
  .related-chip{
    background: var(--chip-bg); border:1px solid var(--line); color:var(--ink);
    padding:6px 12px; border-radius:999px; font-size:0.75rem; cursor:pointer;
  }
  .related-chip:hover{ background: var(--card); border-color: var(--gold); }

  .shortcut-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:0.85rem; }
  .kbd{ background:var(--chip-bg); border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-family:monospace; font-size:0.78rem; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:8px; }

  @media print{
    header, .toolbar, .disclaimer, .categories, .input-bar, .msg-actions, .overlay, .drawer, .drawer-overlay, .scroll-bottom, .toast-wrap{ display:none !important; }
    body{ background:#fff; color:#000; }
    .msg{ box-shadow:none; border:1px solid #ccc; }
  }
  @media (prefers-reduced-motion: reduce){ .thinking .spin, button.icon-round.listening{ animation:none; } }
</style>
</head>
<body>

<header>
  <div class="star-pattern" id="starPattern"></div>
  <h1 id="titleText">باب الجواب</h1>
  <p id="subtitleText">إجابات على استفسارات المسلمين — وفق المذهب الجعفري الشيعي</p>
  <div class="hijri" id="hijriDate"></div>
  <div class="gold-rule"></div>
</header>

<div class="toolbar">
  <div class="toolbar-group">
    <button class="icon-btn" id="sidebarBtn" title="المحادثات">☰</button>
    <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">🌙</button>
    <button class="icon-btn" id="settingsBtn" title="الإعدادات">⚙️</button>
    <button class="icon-btn" id="qiblaBtn" title="القبلة ومواقيت الصلاة">🕌</button>
    <button class="icon-btn" id="calcBtn" title="حاسبة الخمس والزكاة">💰</button>
    <button class="icon-btn" id="linksBtn" title="روابط مواقع المراجع الرسمية">🔗</button>
    <button class="icon-btn" id="libraryBtn" title="أحاديث، أدعية، وآيات قرآنية">📖</button>
    <button class="icon-btn" id="fontFamilyBtn" title="تغيير خط القراءة">Aa</button>
    <button class="icon-btn" id="fontMinus" title="تصغير الخط">A-</button>
    <button class="icon-btn" id="fontPlus" title="تكبير الخط">A+</button>
  </div>
  <div class="toolbar-group">
    <button class="icon-btn" id="exportBtn" title="طباعة/PDF">🖨️</button>
    <button class="icon-btn" id="downloadBtn" title="تنزيل كملف نصي">⬇️</button>
    <button class="icon-btn" id="shortcutsBtn" title="اختصارات لوحة المفاتيح">⌨️</button>
    <select class="lang-select" id="langSelect">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="fa">فارسی</option>
      <option value="ur">اردو</option>
    </select>
  </div>
</div>

<main>
  <div class="disclaimer" id="disclaimerText"></div>
  <div class="categories" id="categoryBar"></div>
  <div class="chat" id="chat">
    <div class="empty-state" id="emptyState">
      <svg class="star-mini" viewBox="0 0 100 100"><use href="#khatam"/></svg>
      <div id="emptyHint"></div>
      <div class="suggestions" id="suggestionsBar"></div>
    </div>
  </div>
</main>

<button class="scroll-bottom" id="scrollBottomBtn">⬇</button>

<div class="input-bar">
  <div class="char-counter" id="charCounter"></div>
  <div class="input-inner">
    <button class="icon-round" id="micBtn" title="سؤال صوتي">🎤</button>
    <textarea id="inputBox" rows="1"></textarea>
    <button class="send" id="sendBtn"></button>
  </div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2 id="settingsTitle">الإعدادات</h2>
    <div class="field">
      <label id="marjaLabel">المرجع المعتمد</label>
      <select id="marjaSelect">
        <option value="">غير محدد</option>
        <option value="السيد علي السيستاني">السيد علي السيستاني</option>
        <option value="السيد علي خامنئي">السيد علي خامنئي (رحمه الله)</option>
        <option value="الشيخ بشير النجفي">الشيخ بشير النجفي</option>
        <option value="السيد محمد إسحاق الفياض">السيد محمد إسحاق الفياض</option>
        <option value="الشيخ محمد اليعقوبي">الشيخ محمد اليعقوبي</option>
        <option value="__other__">مرجع آخر (أكتبه يدويًا)</option>
      </select>
    </div>
    <div class="field" id="customMarjaField" style="display:none;">
      <label id="customMarjaLabel">اسم المرجع</label>
      <input type="text" id="customMarjaInput" placeholder="اكتب اسم المرجع">
    </div>
    <div class="field">
      <label id="answerLengthLabel">طول الإجابة المفضّل</label>
      <div class="seg" id="lengthSeg">
        <button data-v="short">مختصرة</button>
        <button data-v="medium">متوسطة</button>
        <button data-v="detailed">مفصّلة</button>
      </div>
    </div>
    <div class="modal-actions">
      <button id="backupBtn">نسخ احتياطي 📤</button>
      <button id="restoreBtn">استعادة 📥</button>
    </div>
    <input type="file" id="restoreInput" accept="application/json" style="display:none;">
    <div class="modal-actions">
      <button class="danger" id="clearBtn">مسح المحادثة الحالية 🗑️</button>
    </div>
    <div class="modal-actions">
      <button id="settingsCancel">إلغاء</button>
      <button class="primary" id="settingsSave">حفظ</button>
    </div>
  </div>
</div>

<!-- Qibla / Prayer Modal -->
<div class="overlay" id="qiblaOverlay">
  <div class="modal">
    <h2 id="qiblaTitle">القبلة ومواقيت الصلاة</h2>
    <div id="qiblaContent" style="font-size:0.9rem; line-height:2;">
      <button class="modal-actions primary" id="qiblaLocateBtn" style="width:100%; padding:10px; border-radius:10px; border:none; background:var(--deep); color:#F4EFE1; cursor:pointer; font-weight:700;">📍 استخدم موقعي الحالي</button>
    </div>
    <div class="modal-actions">
      <button id="qiblaClose">إغلاق</button>
    </div>
  </div>
</div>

<!-- Religious Library Modal -->
<div class="overlay" id="libraryOverlay">
  <div class="modal" style="max-width:480px;">
    <h2 id="libraryTitle">المكتبة الدينية</h2>
    <div class="drawer-tabs" style="margin-bottom:12px;">
      <button id="libTabHadith" class="active">أحاديث</button>
      <button id="libTabDua">أدعية</button>
      <button id="libTabAyah">آيات</button>
    </div>
    <p style="font-size:0.8rem; color:var(--muted); line-height:1.7; margin-bottom:10px;" id="libHint"></p>
    <div class="suggestions" id="libExamples" style="justify-content:flex-start; margin-bottom:12px;"></div>
    <div class="field" style="margin-bottom:10px;">
      <input type="text" id="libQuery" placeholder="">
    </div>
    <button id="libSearchBtn" style="width:100%; padding:10px; border-radius:10px; border:none; background:var(--deep); color:#F4EFE1; font-weight:700; cursor:pointer;"></button>
    <div id="libResult" style="margin-top:16px; display:flex; flex-direction:column;"></div>
    <div class="modal-actions">
      <button id="libraryClose">إغلاق</button>
    </div>
  </div>
</div>

<!-- Khums/Zakat Calculator Modal -->
<div class="overlay" id="calcOverlay">
  <div class="modal">

   ============================================================ */
function uid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function ensureConversation(){
  if(!appStore.activeId || !appStore.conversations[appStore.activeId]){
    const id = uid();
    appStore.conversations[id] = { id, title:T().defaultTitle, log:[], createdAt:Date.now() };
    appStore.activeId = id;
  }
}
function getActiveConv(){ ensureConversation(); return appStore.conversations[appStore.activeId]; }
function getLog(){ return getActiveConv().log; }

function autoTitle(conv){
  if(conv.title && conv.title !== T().defaultTitle && conv.titleLocked) return;
  const firstUser = conv.log.find(m=>m.role==='user');
  if(firstUser){
    conv.title = firstUser.text.length > 34 ? firstUser.text.slice(0,34)+'…' : firstUser.text;
  }
}

  downloadText((conv.title||'conversation')+'.txt', lines.join('\n\n'));
  showToast(t.exportedTxt);
});
function downloadText(filename, content){
  const blob = new Blob([content], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* Backup / Restore */
backupBtn.addEventListener('click', ()=>{
  const data = JSON.stringify({ settings, appStore }, null, 2);
  downloadText('bab-aljawab-backup.json', data);
  showToast(T().backupDone);
});
restoreBtn.addEventListener('click', ()=> restoreInput.click());
restoreInput.addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(parsed.settings) settings = Object.assign(settings, parsed.settings);
      if(parsed.appStore) appStore = parsed.appStore;
      ensureConversation();
      applyTheme(); applyFont(); applyLanguage();
      saveSettings(); saveStore();
      showToast(T().restoredOk);
      settingsOverlay.classList.remove('open');
    }catch(err){ showToast(T().restoredFail); }
  };
  reader.readAsText(file);
  restoreInput.value = '';
});

   ============================================================ */
function renderChat(){
  const t = T();
  const conv = getActiveConv();
  chat.innerHTML = '';
  if(conv.log.length === 0){
    chat.appendChild(emptyState);
    emptyState.style.display = 'block';
    return;
  }
  conv.log.forEach((item, idx)=>{
    chat.appendChild(buildMsgEl(item, idx===conv.log.length-1));
  });
}

function estimateReadMinutes(text){
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words/180));
}

    actions.appendChild(bmBtn);

    actions.appendChild(speakBtn);

    if(isLast){

      regenBtn.textContent = '🔄 ' + t.regen;
      regenBtn.onclick = ()=> regenerateAnswer(item);
      actions.appendChild(regenBtn);
    }

    div.appendChild(actions);
  }

  return div;
}

/* ============================================================
   Text-to-speech
   ============================================================ */
function speakText(text, btn){
  if(!('speechSynthesis' in window)) return;
  if(currentUtterance && speechSynthesis.speaking){
    speechSynthesis.cancel();
    currentUtterance = null;
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = T().ttsLang;
  currentUtterance = u;
  speechSynthesis.speak(u);
}

/* ============================================================
   Voice input (STT)
   ============================================================ */
function initRecognizer(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.continuous = false;
  r.interimResults = false;
  r.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    inputBox.value = (inputBox.value ? inputBox.value + ' ' : '') + transcript;
    inputBox.dispatchEvent(new Event('input'));
  };
  r.onend = ()=>{ isListening = false; micBtn.classList.remove('listening'); };
  r.onerror = ()=>{ isListening = false; micBtn.classList.remove('listening'); };
  return r;
}
micBtn.addEventListener('click', ()=>{
  if(!recognizer) recognizer = initRecognizer();
  if(!recognizer){ showToast(T().micUnsupported); return; }
  if(isListening){ recognizer.stop(); isListening=false; micBtn.classList.remove('listening'); return; }
  recognizer.lang = T().ttsLang;
  recognizer.start();
  isListening = true;
  micBtn.classList.add('listening');
  showToast(T().micListening);
});

القواعد:

async function runLibrarySearch(){
  const t = T();
  const q = libQuery.value.trim();
  if(!q) return;
  libSearchBtn.disabled = true;
  libResult.innerHTML = '';
  const loadingEl = document.createElement('div');
  loadingEl.className = 'thinking';
  loadingEl.style.alignSelf = 'flex-start';
  loadingEl.innerHTML = `<svg class="spin" viewBox="0 0 100 100"><use href="#khatam"/></svg><span>${t.searching}</span>`;
  libResult.appendChild(loadingEl);

  let answer = '';
  let textEl = null;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:800,
        system: libSystemPrompt(currentLibKind),
        messages: [{ role:'user', content:q }],
        stream:true,
        tools:[{ type:"web_search_20250305", name:"web_search" }]
      })
    });
    if(!response.ok || !response.body) throw new Error('bad response');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, { stream:true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6).trim();
        if(!jsonStr || jsonStr === '[DONE]') continue;
        let evt; try{ evt = JSON.parse(jsonStr); }catch(e){ continue; }
        if(evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta'){
          if(!textEl){
            loadingEl.remove();
            textEl = document.createElement('div');
            textEl.className = 'lib-answer';
            libResult.appendChild(textEl);
          }
          answer += evt.delta.text;
          textEl.textContent = answer;
        }
      }
    }

    if(!answer){
      loadingEl.remove();
      libResult.innerHTML = `<div style="color:var(--muted); font-size:0.85rem;">—</div>`;
    } else {
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      const copyB = document.createElement('button');
      copyB.textContent = '📋 ' + t.copy;
      copyB.onclick = ()=> navigator.clipboard.writeText(answer).then(()=> showToast(t.copied));
      actions.appendChild(copyB);
      const askB = document.createElement('button');
      askB.textContent = '💬 ' + t.libAskMore;
      askB.onclick = ()=>{ libraryOverlay.classList.remove('open'); inputBox.value = q; sendMessage(); };
      actions.appendChild(askB);
      libResult.appendChild(actions);
    }
  }catch(err){
    loadingEl.remove();
    libResult.innerHTML = `<div style="color:var(--danger); font-size:0.85rem;">${t.locError || 'error'}</div>`;
    console.error(err);
  }finally{
    libSearchBtn.disabled = false;
  }
}

function resetQiblaPanel(){
  const t = T();
  qiblaContent.innerHTML = `<button id="qiblaLocateBtn2" style="width:100%; padding:10px; border-radius:10px; border:none; background:var(--deep); color:#F4EFE1; cursor:pointer; font-weight:700;">${t.qiblaLocate}</button>`;
  document.getElementById('qiblaLocateBtn2').addEventListener('click', locateAndCompute);

function bearingToQibla(lat, lon){
  const kaabaLat = 21.4225 * Math.PI/180, kaabaLon = 39.8262 * Math.PI/180;
  const phi1 = lat * Math.PI/180, phi2 = kaabaLat;
  const dLon = kaabaLon - lon * Math.PI/180;
  const y = Math.sin(dLon) * Math.cos(phi2);
  const x = Math.cos(phi1)*Math.sin(phi2) - Math.sin(phi1)*Math.cos(phi2)*Math.cos(dLon);
  let brng = Math.atan2(y, x) * 180/Math.PI;
  return (brng + 360) % 360;
}
function locateAndCompute(){
  const t = T();
  qiblaContent.innerHTML = `<div style="text-align:center; color:var(--muted);">${t.locating}</div>`;
  if(!navigator.geolocation){
    qiblaContent.innerHTML = `<div style="color:var(--danger);">${t.locError}</div>`;
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const { latitude, longitude } = pos.coords;
    const bearing = bearingToQibla(latitude, longitude);
    let prayerHtml = '';
    try{
      const resp = await fetch(`https://api.aladhan.com/v1/timings?latitude=${latitude}&longitude=${longitude}&method=0`);
      const data = await resp.json();
      const tm = data.data.timings;
      prayerHtml = `
        <div style="margin-top:14px;"><strong>${t.prayerTimesTitle}</strong></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px;">
          <div>${t.fajr}: ${tm.Fajr}</div><div>${t.dhuhr}: ${tm.Dhuhr}</div>
          <div>${t.asr}: ${tm.Asr}</div><div>${t.maghrib}: ${tm.Maghrib}</div>
          <div>${t.isha}: ${tm.Isha}</div>
        </div>`;
    }catch(e){ prayerHtml = ''; }
    qiblaContent.innerHTML = `
      <div><strong>${t.qiblaDirection}:</strong> ${Math.round(bearing)}° — ${t.degreesFromNorth}</div>
      ${prayerHtml}
    `;
  }, ()=>{
    qiblaContent.innerHTML = `<div style="color:var(--danger);">${t.locError}</div>`;
  });
}

/* ============================================================
   System prompt + API messages
   ============================================================ */
const BASE_SYSTEM_PROMPT = `أنت مساعد معرفي متخصص في الإجابة عن استفسارات المسلمين، وفق المذهب الجعفري الشيعي الاثني عشري تحديدًا، ما لم يُطلب منك خلاف ذلك.
قواعد عملك:
1) أجب بأسلوب محترم وهادئ، وتجنّب الأحكام القاطعة في المسائل الخلافية دون الإشارة إلى الخلاف.
2) في مسائل العقيدة والتاريخ والسيرة والأخلاق، أجب مباشرة من معرفتك.
3) في المسائل الفقهية العملية، اذكر الرأي المشهور بين فقهاء الشيعة، لكن نبّه دائمًا إلى ضرورة الرجوع لرسالة مرجع التقليد الذي يقلّده السائل.
4) إذا لم تكن متأكدًا من معلومة، أو كانت تحتاج تحققًا حديثًا، استخدم أداة البحث في الإنترنت قبل الإجابة.
5) لا تنسب أي قول أو فتوى إلى مرجع معين دون التأكد من مصدر موثوق عبر البحث.
6) اختم أي إجابة فقهية عملية بجملة تذكيرية مختصرة بضرورة الرجوع إلى المرجع.
7) نظّم إجابتك بشكل واضح وتجنّب الحشو.
8) عند الاستشهاد بآية أو حديث، اذكر مصدره دون نسخ نصوص طويلة حرفيًا.
9) إن استخدمت البحث، لخّص بأسلوبك الخاص ولا تنسخ نصوصًا من نتائج البحث.
10) اكتب الإجابة دائمًا باللغة المطلوبة في السياق المرفق، والتزم بطول الإجابة المطلوب (مختصرة/متوسطة/مفصّلة).
11) بعد نهاية إجابتك مباشرة، أضف سطرًا جديدًا يبدأ بالضبط بـ "RELATED::" يليه ثلاثة أسئلة متابعة قصيرة ذات صلة بسؤال المستخدم، مفصولة برمز "|" فقط، بدون أي شرح أو تعداد أو نص إضافي بعد هذا السطر. مثال: RELATED::سؤال أول؟|سؤال ثانٍ؟|سؤال ثالث؟`;

function buildContextPrefix(item){
  const t = LANGS[item.lang] || LANGS.ar;
  const parts = [];
  if(item.category && item.category !== 'general') parts.push(`Category: ${t.categories[item.category]}`);
  parts.push(`Answer language: ${t.instruction}`);
  parts.push(`Answer length: ${item.answerLength || 'medium'}`);
  if(item.marja) parts.push(`User's marja' of taqlid: ${item.marja}`);
  return `[${parts.join(' | ')}]\n`;
}
function toApiMessages(log){
  return log.map(item => item.role==='user'
    ? { role:'user', content: buildContextPrefix(item) + item.text }
    : { role:'assistant', content: item.text });
}

/* ============================================================
   Streaming
   ============================================================ */
async function streamAnswer(historyForApi, meta){
  const t = T();
  const conv = getActiveConv();
  addThinking(t.thinking);

  let answer = '';
  let bubbleItem = null;
  let bubbleWrapEl = null;
  let bubbleEl = null;
  let rafScheduled = false;

  function isNearBottom(){ return (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 160); }
  function flushUpdate(){
    rafScheduled = false;
    if(!bubbleEl) return;
    const wasNear = isNearBottom();
    bubbleEl.textContent = answer;
    if(wasNear) window.scrollTo(0, document.body.scrollHeight);
  }

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:2048, system:BASE_SYSTEM_PROMPT,
        messages:historyForApi, stream:true,
        tools:[{ type:"web_search_20250305", name:"web_search" }]
      })
    });
    if(!response.ok || !response.body) throw new Error('bad response');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, { stream:true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6).trim();
        if(!jsonStr || jsonStr === '[DONE]') continue;
        let evt; try{ evt = JSON.parse(jsonStr); }catch(e){ continue; }

        if(evt.type==='content_block_start' && evt.content_block && evt.content_block.type==='server_tool_use'){
          setThinkingText(t.searching);
        }
        if(evt.type==='content_block_delta' && evt.delta && evt.delta.type==='text_delta'){
          if(!bubbleItem){
            removeThinking();
            bubbleItem = { id:'m'+Date.now()+'a', role:'ai', text:'', category:meta.category, lang:meta.lang, marja:meta.marja, answerLength:meta.answerLength, feedback:null, bookmarked:false, ts:Date.now(), streaming:true };
            conv.log.push(bubbleItem);
            renderChat();
            bubbleWrapEl = chat.querySelector(`[data-id="${bubbleItem.id}"]`);
            if(bubbleWrapEl) bubbleWrapEl.classList.add('streaming');
            bubbleEl = bubbleWrapEl ? bubbleWrapEl.querySelector('.body-text') : null;
          }
          answer += evt.delta.text;
          bubbleItem.text = answer;
          if(!rafScheduled){ rafScheduled = true; requestAnimationFrame(flushUpdate); }
        }
      }
    }

    if(bubbleItem){
      bubbleItem.streaming = false;
      if(bubbleWrapEl) bubbleWrapEl.classList.remove('streaming');
      const relMatch = answer.match(/\n?RELATED::(.*)$/s);
      if(relMatch){
        bubbleItem.text = answer.slice(0, relMatch.index).trim();
        bubbleItem.related = relMatch[1].split('|').map(s=>s.trim()).filter(Boolean).slice(0,3);
      }
    }
    removeThinking();
    autoTitle(conv);
    renderChat();
    renderDrawer();
    window.scrollTo(0, document.body.scrollHeight);

    if(!answer){
      conv.log.push({ id:'m'+Date.now()+'a', role:'ai', text:'عذرًا، حدث خطأ أثناء توليد الإجابة. حاول مرة أخرى.', category:meta.category, lang:meta.lang, ts:Date.now() });
      renderChat();
    }
    saveStore();
  }catch(err){
    removeThinking();
    conv.log.push({ id:'m'+Date.now()+'a', role:'ai', text:'حدث خطأ في الاتصال. الرجاء المحاولة مرة أخرى.', category:meta.category, lang:meta.lang, ts:Date.now() });
    renderChat(); saveStore();
    console.error(err);
  }finally{
    sendBtn.disabled = false;
  }
}

function addThinking(text){
  const div = document.createElement('div');
  div.className = 'thinking'; div.id = 'thinkingIndicator';
  div.innerHTML = `<svg class="spin" viewBox="0 0 100 100"><use href="#khatam"/></svg><span>${text}</span>`;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}
function setThinkingText(text){ const el = document.getElementById('thinkingIndicator'); if(el) el.querySelector('span').textContent = text; }
function removeThinking(){ const el = document.getElementById('thinkingIndicator'); if(el) el.remove(); }

async function sendMessage(){
  const text = inputBox.value.trim();
  if(!text) return;
  inputBox.value = ''; inputBox.style.height='auto'; charCounter.textContent='';
  sendBtn.disabled = true;
  try{ await window.storage.delete('draft'); }catch(e){}

  const conv = getActiveConv();
  const userItem = { id:'m'+Date.now()+'u', role:'user', text, category:activeCategory, lang:settings.lang, marja:settings.marja, answerLength:settings.answerLength, ts:Date.now() };
  conv.log.push(userItem);
  emptyState.style.display = 'none';
  renderChat(); saveStore(); renderDrawer();

  await streamAnswer(toApiMessages(conv.log), { category:activeCategory, lang:settings.lang, marja:settings.marja, answerLength:settings.answerLength });
}

async function regenerateAnswer(aiItem){
  const conv = getActiveConv();
  const idx = conv.log.findIndex(m=>m.id===aiItem.id);
  if(idx < 1) return;
  const precedingUser = conv.log[idx-1];
  if(!precedingUser || precedingUser.role !== 'user') return;
  conv.log.splice(idx, 1);
  renderChat(); saveStore();
  sendBtn.disabled = true;
  await streamAnswer(toApiMessages(conv.log), { category:precedingUser.category, lang:precedingUser.lang, marja:precedingUser.marja, answerLength:precedingUser.answerLength || settings.answerLength });
}

(async function init(){
  try{
    const s = await window.storage.get('app-settings');
    if(s && s.value) settings = Object.assign(settings, JSON.parse(s.value));
  }catch(e){}
  try{
    const c = await window.storage.get('app-conversations');
    if(c && c.value) appStore = JSON.parse(c.value);
  }catch(e){}
  ensureConversation();

  applyTheme();
  applyFont();
  applyLanguage();

  try{
    const d = await window.storage.get('draft');
    if(d && d.value){
      inputBox.value = d.value;
      inputBox.dispatchEvent(new Event('input'));
      showToast(T().draftRestored);
    }
  }catch(e){}
})();
